<div class="hacker-bg-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10; overflow: hidden; pointer-events: none; opacity: 0.18;">
  <canvas id="hacker-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
</div>

<script src="/js/hacker-bg.js"></script>

<article class="max-w-full prose dark:prose-invert">
  {{ with .Title }}
    <header>
      <h1>{{ . | emojify }}</h1>
    </header>
  {{ end }}
  <section class="w-full">{{ .Content }}</section>
</article>
<section>
  {{ partial "recent-articles/main.html" . }}
</section>
